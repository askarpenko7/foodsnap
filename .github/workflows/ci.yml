name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node first, then Corepack, then Node again for the cache. The second call
      # is nearly free (the toolchain is already installed) but it is the only
      # ordering that works: `cache: yarn` shells out to `yarn` to locate the
      # cache folder, and `yarn` does not exist until Corepack has enabled it.
      - uses: actions/setup-node@v4
        with:
          # Matches the Docker base image and the tsup target (see the Verified
          # Versions table in IMPLEMENTATION_PLAN.md).
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install
        # --immutable fails the build if yarn.lock would have to change, which is
        # what you want in CI: a lockfile drift should be a red build, not a
        # silent resolution.
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      # No emulator or simulator jobs by design — the native module is mocked in
      # the app tests, so this stays a fast, hermetic check.
      - name: Test
        run: yarn test
