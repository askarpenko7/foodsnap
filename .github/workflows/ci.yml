name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push to the same branch makes an in-flight run redundant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Matches the Docker base image and the tsup target (see the Verified
          # Versions table in IMPLEMENTATION_PLAN.md).
          node-version: 24
          # Yarn 4 comes from the packageManager field via Corepack; this caches
          # the global Yarn cache keyed on yarn.lock.
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install
        # --immutable fails the build if yarn.lock would have to change, which is
        # what you want in CI: a lockfile drift should be a red build, not a
        # silent resolution.
        run: yarn install --immutable

      - name: Typecheck
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      # No emulator or simulator jobs by design — the native module is mocked in
      # the app tests, so this stays a fast, hermetic check.
      - name: Test
        run: yarn test
